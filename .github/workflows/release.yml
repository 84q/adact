name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  CONFIGURATION: Release
  WINDOWS_PROJECT: src/Adact.Cli/Adact.Cli.csproj
  CLIENT_PROJECT: src/Adact.Cli.Client/Adact.Cli.Client.csproj

jobs:
  package-win:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rid:
          - win-x64
          - win-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Compute package name
        id: vars
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "push" -and "${{ github.ref }}" -like "refs/tags/v*") {
            $version = "${{ github.ref_name }}"
          }
          else {
            $version = "manual-${{ github.run_number }}-$($env:GITHUB_SHA.Substring(0, 7))"
          }

          $rid = "${{ matrix.rid }}"

          "version=$version" >> $env:GITHUB_OUTPUT
          "asset_name=adact-$version-$rid.zip" >> $env:GITHUB_OUTPUT
          "artifact_name=release-asset-$rid" >> $env:GITHUB_OUTPUT

      - name: Build solution
        run: dotnet build adact.sln --configuration ${{ env.CONFIGURATION }}

      - name: Run unit and integration tests
        run: dotnet test --configuration ${{ env.CONFIGURATION }} --filter "Layer=Unit|Layer=Integration"

      - name: Publish Windows package
        run: >-
          dotnet publish ${{ env.WINDOWS_PROJECT }}
          --configuration ${{ env.CONFIGURATION }}
          --runtime ${{ matrix.rid }}
          --self-contained true
          --output artifacts/publish/${{ matrix.rid }}

      - name: Create ZIP package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/packages | Out-Null

          $zipPath = Join-Path (Resolve-Path artifacts/packages) "${{ steps.vars.outputs.asset_name }}"

          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }

          Compress-Archive -Path artifacts/publish/${{ matrix.rid }}/* -DestinationPath $zipPath

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vars.outputs.artifact_name }}
          path: artifacts/packages/${{ steps.vars.outputs.asset_name }}
          if-no-files-found: error

  package-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Compute package name
        id: vars
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "push" -and "${{ github.ref }}" -like "refs/tags/v*") {
            $version = "${{ github.ref_name }}"
          }
          else {
            $version = "manual-${{ github.run_number }}-$($env:GITHUB_SHA.Substring(0, 7))"
          }

          "asset_name=adact-$version-linux-x64.tar.gz" >> $env:GITHUB_OUTPUT
          "artifact_name=release-asset-linux-x64" >> $env:GITHUB_OUTPUT

      - name: Build Linux client project
        run: dotnet build ${{ env.CLIENT_PROJECT }} --configuration ${{ env.CONFIGURATION }} --runtime linux-x64

      - name: Publish Linux client package
        run: >-
          dotnet publish ${{ env.CLIENT_PROJECT }}
          --configuration ${{ env.CONFIGURATION }}
          --runtime linux-x64
          --self-contained true
          --output artifacts/publish/linux-x64

      - name: Create tar.gz package
        run: |
          mkdir -p artifacts/packages
          tar -C artifacts/publish/linux-x64 -czf artifacts/packages/${{ steps.vars.outputs.asset_name }} .

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vars.outputs.artifact_name }}
          path: artifacts/packages/${{ steps.vars.outputs.asset_name }}
          if-no-files-found: error

  package-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Compute package name
        id: vars
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "push" -and "${{ github.ref }}" -like "refs/tags/v*") {
            $version = "${{ github.ref_name }}"
          }
          else {
            $version = "manual-${{ github.run_number }}-$($env:GITHUB_SHA.Substring(0, 7))"
          }

          "asset_name=adact-$version-osx-arm64.tar.gz" >> $env:GITHUB_OUTPUT
          "artifact_name=release-asset-osx-arm64" >> $env:GITHUB_OUTPUT

      - name: Build macOS client project
        run: dotnet build ${{ env.CLIENT_PROJECT }} --configuration ${{ env.CONFIGURATION }} --runtime osx-arm64

      - name: Publish macOS client package
        run: >-
          dotnet publish ${{ env.CLIENT_PROJECT }}
          --configuration ${{ env.CONFIGURATION }}
          --runtime osx-arm64
          --self-contained true
          --output artifacts/publish/osx-arm64

      - name: Create tar.gz package
        run: |
          mkdir -p artifacts/packages
          tar -C artifacts/publish/osx-arm64 -czf artifacts/packages/${{ steps.vars.outputs.asset_name }} .

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vars.outputs.artifact_name }}
          path: artifacts/packages/${{ steps.vars.outputs.asset_name }}
          if-no-files-found: error

  create-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - package-win
      - package-linux
      - package-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-asset-*
          path: artifacts/packages
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/packages/*
          generate_release_notes: true
          fail_on_unmatched_files: true
